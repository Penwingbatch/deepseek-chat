<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DeepSeek 智能助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0f0f13;
            color: #e1e3e8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            text-align: center;
            border-bottom: 1px solid #2c2c35;
            flex-shrink: 0;
        }
        .chat-header h1 { font-size: 1.4rem; font-weight: 600; background: linear-gradient(135deg, #64ffda, #4c9aff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .chat-header p { font-size: 0.75rem; color: #8b8b93; margin-top: 4px; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message { display: flex; gap: 12px; max-width: 85%; animation: fadeIn 0.3s ease; }
        .user-message { align-self: flex-end; flex-direction: row-reverse; }
        .assistant-message { align-self: flex-start; }
        .message-content {
            padding: 12px 16px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message .message-content {
            background: linear-gradient(135deg, #4c9aff, #2a6ed9);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .assistant-message .message-content {
            background: #1e1e24;
            color: #e1e3e8;
            border-bottom-left-radius: 4px;
            border: 1px solid #2c2c35;
        }
        .typing-indicator { display: flex; gap: 4px; align-items: center; background: #1e1e24; border-radius: 20px; border-bottom-left-radius: 4px; padding: 12px 16px; width: fit-content; border: 1px solid #2c2c35; }
        .typing-dot { width: 8px; height: 8px; background: #8b8b93; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chat-input-container {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-top: 1px solid #2c2c35;
            flex-shrink: 0;
        }
        .input-wrapper { display: flex; gap: 12px; align-items: flex-end; }
        .chat-input {
            flex: 1;
            background: #1a1a20;
            border: 1px solid #2c2c35;
            border-radius: 24px;
            padding: 12px 18px;
            color: #e1e3e8;
            font-size: 0.95rem;
            resize: none;
            font-family: inherit;
            transition: all 0.2s;
            max-height: 120px;
        }
        .chat-input:focus { outline: none; border-color: #4c9aff; background: #202028; }
        .send-btn {
            background: linear-gradient(135deg, #4c9aff, #2a6ed9);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, opacity 0.2s;
            flex-shrink: 0;
        }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: #1a1a20; }
        .chat-messages::-webkit-scrollbar-thumb { background: #3a3a44; border-radius: 10px; }
        @media (max-width: 600px) { .message { max-width: 90%; } .chat-header h1 { font-size: 1.2rem; } }
    </style>
</head>
<body>
    <div class="chat-header">
        <h1>🤖 DeepSeek 智能助手</h1>
        <p>Powered by DeepSeek API | 在线对话</p>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-container">
        <div class="input-wrapper">
            <textarea class="chat-input" id="userInput" rows="1" placeholder="输入你的问题..."></textarea>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        // 改成你的 Cloudflare Worker 地址
        const API_URL = 'https://deepseek-proxy.sherly214782.workers.dev';
        const MODEL = 'deepseek-chat';

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let isLoading = false;

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;
            userInput.disabled = true;
            userInput.value = '';
            userInput.style.height = 'auto';

            addMessage(message, 'user');
            const loadingId = showLoadingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            { role: 'system', content: '你是DeepSeek智能助手，由深度求索公司创造。请用中文友好、专业地回答问题。' },
                            { role: 'user', content: message }
                        ],
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 请求失败: ${response.status}`);
                }

                const data = await response.json();
                const assistantMessage = data.choices[0].message.content;
                
                removeLoadingIndicator(loadingId);
                addMessage(assistantMessage, 'assistant');
            } catch (error) {
                removeLoadingIndicator(loadingId);
                addMessage(`❌ 请求失败: ${error.message}`, 'assistant');
                console.error('API 调用错误:', error);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(content, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role === 'user' ? 'user-message' : 'assistant-message'}`;
            messageDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function showLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = id;
            loadingDiv.className = 'message assistant-message';
            loadingDiv.innerHTML = `<div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
            chatMessages.appendChild(loadingDiv);
            scrollToBottom();
            return id;
        }

        function removeLoadingIndicator(id) {
            const element = document.getElementById(id);
            if (element) element.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/\n/g, '<br>');
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
