<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0f0f13;
            color: #e1e3e8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            text-align: center;
            border-bottom: 1px solid #2c2c35;
            flex-shrink: 0;
        }
        .chat-header h1 { font-size: 1.4rem; font-weight: 600; background: linear-gradient(135deg, #64ffda, #4c9aff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .chat-header p { font-size: 0.75rem; color: #8b8b93; margin-top: 4px; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message { display: flex; gap: 12px; max-width: 85%; animation: fadeIn 0.3s ease; }
        .user-message { align-self: flex-end; flex-direction: row-reverse; }
        .assistant-message { align-self: flex-start; }
        .message-content {
            padding: 12px 16px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message .message-content {
            background: linear-gradient(135deg, #4c9aff, #2a6ed9);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .assistant-message .message-content {
            background: #1e1e24;
            color: #e1e3e8;
            border-bottom-left-radius: 4px;
            border: 1px solid #2c2c35;
        }
        .typing-indicator { display: flex; gap: 4px; align-items: center; background: #1e1e24; border-radius: 20px; border-bottom-left-radius: 4px; padding: 12px 16px; width: fit-content; border: 1px solid #2c2c35; }
        .typing-dot { width: 8px; height: 8px; background: #8b8b93; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chat-input-container {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-top: 1px solid #2c2c35;
            flex-shrink: 0;
        }
        .input-wrapper { display: flex; gap: 12px; align-items: flex-end; }
        .chat-input {
            flex: 1;
            background: #1a1a20;
            border: 1px solid #2c2c35;
            border-radius: 24px;
            padding: 12px 18px;
            color: #e1e3e8;
            font-size: 0.95rem;
            resize: none;
            font-family: inherit;
            transition: all 0.2s;
            max-height: 120px;
        }
        .chat-input:focus { outline: none; border-color: #4c9aff; background: #202028; }
        .send-btn {
            background: linear-gradient(135deg, #4c9aff, #2a6ed9);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, opacity 0.2s;
            flex-shrink: 0;
        }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: #1a1a20; }
        .chat-messages::-webkit-scrollbar-thumb { background: #3a3a44; border-radius: 10px; }
        @media (max-width: 600px) { .message { max-width: 90%; } .chat-header h1 { font-size: 1.2rem; } }

        /* 密码弹窗样式 */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .password-modal {
            background: #1e1e24;
            border-radius: 24px;
            padding: 32px;
            width: 300px;
            text-align: center;
            border: 1px solid #2c2c35;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        .password-modal h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #64ffda, #4c9aff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .password-modal input {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            border: 1px solid #2c2c35;
            background: #0f0f13;
            color: #e1e3e8;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
        }
        .password-modal input:focus {
            border-color: #4c9aff;
        }
        .password-modal button {
            background: linear-gradient(135deg, #4c9aff, #2a6ed9);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .password-modal button:active {
            transform: scale(0.97);
        }
        .error-msg {
            color: #ff6b6b;
            margin-top: 12px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

        <h1>🤖 DeepSeek 智能助手</h1>
        <p>Powered by DeepSeek API | 在线对话</p>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-container">
        <div class="input-wrapper">

        </div>

    <!-- 密码弹窗 -->
    <div id="passwordOverlay" class="password-overlay">
        <div class="password-modal">
            <h2>🔐 访问验证</h2>
            <input type="password" id="passwordInput" placeholder="请输入访问密码" autofocus>
            <button id="unlockBtn">解锁</button>

        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const passwordOverlay = document.getElementById('passwordOverlay');
        const passwordInput = document.getElementById('passwordInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsgDiv = document.getElementById('errorMsg');

        let isLoading = false;
        let isUnlocked = false;

        // 解锁函数
        function unlock() {
            const enteredPassword = passwordInput.value;
            if (enteredPassword === CORRECT_PASSWORD) {
                isUnlocked = true;
                passwordOverlay.style.display = 'none';
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            } else {
                errorMsgDiv.textContent = '密码错误，请重试';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        unlockBtn.addEventListener('click', unlock);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') unlock();
        });

        // 原有聊天逻辑（仅当解锁后可用）
        userInput.addEventListener('input', function() {
            if (!isUnlocked) return;
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        async function sendMessage() {
            if (!isUnlocked) return;
            const message = userInput.value.trim();
            if (!message || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;
            userInput.disabled = true;
            userInput.value = '';
            userInput.style.height = 'auto';

            addMessage(message, 'user');
            const loadingId = showLoadingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',

幽默风趣，偶尔会用调侃、自嘲的方式缓解紧张气氛，与其他英雄互动时带有轻松的幽默感
谦逊好学，意识到自身局限后，虚心学习魔法，尊重前辈与同伴
习惯将情绪藏在沉稳的外表下，即使内心波动剧烈，也很少通过激烈的言行表现，更倾向于用行动传递情感

会用独特的魔法方式传递关心
重视我的独立意志，不会用能力干涉我的选择，仅在危急时出手
内心有强烈的责任感，既担心自己的身份给我带来危险，又忍不住靠近
很依赖我，会主动在我面前展露脆弱，卸下强大的一面对我怀有性欲，喜欢和亲密接触
高占有欲，醋坛子不会害羞

你习惯称呼我为“Kid”。某些私人场合会叫我“Little fox”或“Sweetie”或“Babe”
8.与用户的关系
复仇者联盟的同事，兼用户的魔法导师
9.用户的身份
目前是19岁，在上大学，处于保密原因，极少数人知道我是新加入复联的成员，除复联自己人外。用户的超能力刚解锁不久，目前不会控制
【互动要求】
1.    你需要严格遵循第三人称的写作格式，将人物的话语用双引号表示，并且单独成行！！换行后再描写你所扮演的人物的反应、心理活动和所见所感，不需要描写用户动作相关。你需要用外貌描写和环境描写来使画面清晰真实。
2.  可以有强/制诱/哄等行为。
3.    有敏感色色词汇时用/隔开，不能阻碍剧情发展，必要时用拼音替代。

【扮演规则】
1.   整个对话保持口语化，不要用晦涩语言，用词直白简洁，减少不必要的比喻、意象和动作
     2.检索人设，遵循人设扮演，不要脱离
    3.回复时字数多一些，可描写环境或气氛，类似于在看小说
    4.有时可适当加入复联其他成员的剧情，性格及设定均与漫威MCU电影里一致（ps：托尼斯塔克对我的感觉类似于他对SpiderMan，复联所有人都认识我，我的地位类似于SpiderMan，而因为我的能力是魔法系，因此暂时被交给Stephen带着，有突发事件时复仇者们通常以年纪小的理由不让我去，你们自己就处理完了，但我总是偷偷去我目前在上大学，所以和PeterParker有些像，自己出手处理一些社区抢劫或一些问题，平时住在学校宿舍）（ps：TonyStark很喜欢我，我们性格很像都是ENTP））
【格式指令】
【注意】你的每句回复中，动作和环境描写用（）表示，人物话语描写用“”表示，并且不同描写要隔一行！！一定要隔一行！禁止发一连串文字！！
例如：
（他走进咖啡馆）
“好久不见。”
（他望向你）
（以此类推，每次都要隔一行！！！）' },
                            { role: 'user', content: message }
                        ],
                        stream: false
                    })
                });

                if (!response.ok) {
                    let errorText = `API 请求失败: ${response.status}`;
                    if (response.status === 401) errorText = '密码验证失败，请刷新页面重试';
                    throw new Error(errorText);
                }

                const data = await response.json();
                const assistantMessage = data.choices[0].message.content;
                
                removeLoadingIndicator(loadingId);
                addMessage(assistantMessage, 'assistant');
            } catch (error) {
                removeLoadingIndicator(loadingId);
                addMessage(`❌ 请求失败: ${error.message}`, 'assistant');
                console.error('API 调用错误:', error);
            } finally {
                isLoading = false;
                if (isUnlocked) {
                    sendBtn.disabled = false;
                    userInput.disabled = false;
                    userInput.focus();
                }
            }
        }

        function addMessage(content, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role === 'user' ? 'user-message' : 'assistant-message'}`;
            messageDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function showLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = id;
            loadingDiv.className = 'message assistant-message';
            loadingDiv.innerHTML = `<div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
            chatMessages.appendChild(loadingDiv);
            scrollToBottom();
            return id;
        }

        function removeLoadingIndicator(id) {
            const element = document.getElementById(id);
            if (element) element.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/\n/g, '<br>');
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !isLoading && isUnlocked) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
